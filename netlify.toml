[build]
  command = "npm install"
  publish = "public"

# Netlify Functions live under netlify/functions by default.
# This config keeps that convention.
[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Forward all other API routes (your Express app registers /protected etc.)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[dev]
  command = "npm run dev"
  functions = "functions"
  port = 8888